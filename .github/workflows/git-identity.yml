name: Git identity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  approved-identity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate commit identities
        run: ./scripts/check-git-identity.sh --history-only
