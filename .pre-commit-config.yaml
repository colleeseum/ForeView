repos:
  - repo: local
    hooks:
      - id: diff-check
        name: Git whitespace check
        entry: git diff --cached --check
        language: system
        pass_filenames: false
      - id: license-check
        name: License header check
        entry: make license-check
        language: system
        pass_filenames: false
      - id: ruff-check
        name: Ruff lint
        entry: .venv/bin/python -m ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: .venv/bin/python -m ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: .venv/bin/python -m mypy
        language: system
        pass_filenames: false
      - id: coverage-gate
        name: Coverage gate
        entry: make coverage-gate
        language: system
        pass_filenames: false
