[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".runtime", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
filterwarnings = ["error::ResourceWarning"]

[tool.coverage.run]
branch = true
source = ["."]
omit = [".runtime/*", ".venv/*", "tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
# Project non-regression floor for branch-aware coverage.
fail_under = 80
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.mypy]
python_version = "3.14"
files = ["app.py", "runtime_backup.py", "synthetic_documents.py", "synthetic_questrade.py", "synthetic_runtime.py", "update_public_rules.py", "domain", "infrastructure", "ingestion", "institution_support", "institutions", "projection", "repositories", "services", "web"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
exclude = ["^\\.runtime/", "^\\.venv/"]

[tool.bandit]
exclude_dirs = [".runtime", ".venv", "tests"]
skips = ["B101"]
